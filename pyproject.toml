[project]
name = "tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "regex>=2026.5.9",
]

[build-system]
requires = ["setuptools>=61.0.0"]
